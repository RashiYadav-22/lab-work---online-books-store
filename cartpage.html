<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
           
        }

        .main-layout {
            width: 100%;
            max-width: 900px;
            border-collapse: collapse;
            border: 1px solid #000;
            
        }

        .main-layout th, 
        .main-layout td {
            border: 1px solid #000;
            padding: 8px 12px;
            text-align: center;
           
        }
        .cart-table {
            width: 100%;
            border-collapse: collapse;
            
        }

        .cart-table th, 
        .cart-table td {
            border: none;
            padding: 6px 10px;
        }

        .cart-table .left-align {
            text-align: left;
        
        }

        .cart-table .center-align {
            text-align: center;
            
        }

        .cart-table .right-align {
            text-align: right;
        }

        .total-row {
            font-weight: normal;
        }
    </style>
</head>
<body>

    <table class="main-layout">
        <tr>
            <td style="width: 15%;"><img src="glb.jpg" alt="GL Bajaj logo" class="logo-img"></td>
            <td colspan="4" style="font-size: 1.1em; font-weight: bold;">GL BAJAJ INSTITUTE OF TECHNOLOGY : ONLINE BOOK STORE</td>
        
        </tr>

        <tr>
            <td>Home</td>
            <td>Login</td>
            <td>Registration</td>
            <td>Catalogue</td>
            <td style="width: 20%;">Cart</td>
        </tr>

        <tr>
            <td style="vertical-align: top; text-align: left; line-height: 1.8;">
                CSE Books<br>
                ECE Books<br>
                EEE Books<br>
                CIVIL Books<br>
            </td>

            <td colspan="4" style="vertical-align: top; padding: 0;">
                <table class="cart-table">
                    <thead>
                        <tr>
                            <th class="left-align" style="width: 35%;">Book name</th>
                            <th class="center-align" style="width: 20%;">Price</th>
                            <th class="center-align" style="width: 20%;">Quantity</th>
                            <th class="right-align" style="width: 25%;">Amount</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td class="left-align">Java 2</td>
                            <td class="center-align">$35.5</td>
                            <td class="center-align">2</td>
                            <td class="right-align">$70</td>
                        </tr>
                        <tr>
                            <td class="left-align">XML bible</td>
                            <td class="center-align">$40.5</td>
                            <td class="center-align">1</td>
                            <td class="right-align">$40.5</td>
                        </tr>
                        <tr class="total-row">
                            <td class="left-align">Total amount</td>
                            <td class="center-align">- $130.5</td>
                            <td></td>
                            <td></td>
                        </tr>
                    </tbody>
                </table>
            </td>
        </tr>
    </table>

<footer>
Created by <span> RASHI YADAV</span> | Roll no. <span> 2501920110297</span>
</footer>
</body>
</html>
