<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page Layout</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        .layout-container {
            border: 1px solid #000;
            width: 800px;
            margin: 0 auto;
        }

        
        .header {
            display: flex;
            background-color: #fbc89a;
            border-bottom: 1px solid #000;
        }

        .logo-box {
            width: 25%;
            padding: 12px 0;
            text-align: center;
            border-right: 1px solid #000;
            font-weight: bold;
        }

        .website-name {
            width: 75%;
            padding: 70px ;
            text-align: center;
            font-weight: bold;
            font-style: oblique;
            font-size: larger;
        }
        .nav-bar {
            display: flex;
            background-color:cadetblue;
            border-bottom: 1px solid #000;
        }
        .nav-item {
            flex: 1;
            padding: 10px 0;
            text-align: center;
            border-right: 1px solid #000;
            font-weight: bold;
            text-decoration: none;
            color: #000;
        }
        .nav-item:last-child {
            border-right: none;
        }
        .main-content {
            display: flex;
            min-height: 350px;
        }

        .sidebar {
            width: 25%;
            border-right: 1px solid #000;
            padding: 20px;
            box-sizing: border-box;
        }
        .sidebar ul {
            list-style-type: none;
            padding: 0;
            margin: 0;
        }

        .sidebar li {
            font-weight: bold;
            margin-bottom: 35px;
        }
        .content-area {
            width: 75%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 0;
        }

        .login-box {
            text-align: center;
            width: 320px;
        }

        .login-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 25px;
        }

        .form-group {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 15px;
        }

        .form-group label {
            font-weight: bold;
            font-size: 15px;
        }

        .form-group input {
            width: 170px;
            height: 24px;
            border: 2px solid #000;
            padding: 2px 5px;
            box-sizing: border-box;
        }

        .button-group {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 35px;
        }

        .btn {
            background-color: #fff;
            color: #cc3333;
            font-size: 16px;
            font-weight: 500;
            padding: 6px 20px;
            cursor: pointer;
        }

        .btn-submit {
            border: 2px solid #000;
            box-shadow: 3px 3px 0px #000;
        }

        .btn-reset {
            border: 1px solid #000;
        }
    </style>
</head>
<body>

    <div class="layout-container">
        <div class="header">
            <div class=""></div>
            <td class="logo"><img src="glb.jpg" alt="GL Bajaj logo" class="logo-img"></td>
            <div class="website-name">GL BAJAJ INSTITUTE OF TECHNOLOGY : ONLINE BOOK STORE </div>
        </div>

        <div class="nav-bar">
            <a href="#" class="nav-item">Home</a>
            <a href="#" class="nav-item">Login</a>
            <a href="#" class="nav-item">Registration</a>
            <a href="#" class="nav-item">Catalogue</a>
            <a href="#" class="nav-item">Cart</a>
        </div>

        <div class="main-content">
            <div class="sidebar">
                <ul>
                    <li>CSE Books</li>
                    <li>ECE Books</li>
                    <li>EEE Books</li>
                    <li>CIVIL Books</li>
                </ul>
            </div>

            <div class="content-area">
                <div class="login-box">
                    <div class="login-title">Login Page</div>
                    <form action="#" method="post">
                        <div class="form-group">
                            <label for="username">User Name:</label>
                            <input type="text" id="username" name="username">
                        </div>
                        <div class="form-group">
                            <label for="password">Passwords:</label>
                            <input type="password" id="password" name="password">
                        </div>
                        <div class="button-group">
                            <button type="submit" class="btn btn-submit">Submit</button>
                            <button type="reset" class="btn btn-reset">Reset</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <footer>
   Created by <span> RASHI YADAV </span> | Roll no. <span> 2501920110297</span>     
    </footer>
</body>
</html>
